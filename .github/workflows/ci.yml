name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # tests/keyring_live.rs must reach the real OS store here instead of skipping.
  KEYRING_LIVE_REQUIRED: "1"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # One runner per OS; mobile cross-builds ride along on Linux (Android) and macOS (iOS).
          - os: ubuntu-latest
            mobile: aarch64-linux-android
          - os: macos-latest
            mobile: aarch64-apple-ios
          - os: windows-latest
            mobile: ""
    steps:
      - uses: actions/checkout@v4

      - name: Linux system deps (webkit for tauri, D-Bus + gnome-keyring for Secret Service)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libdbus-1-dev pkg-config gnome-keyring dbus-x11

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.mobile }}
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Clippy (no default features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Rust tests (unit, IPC, live OS keyring)
        if: runner.os != 'Linux'
        run: |
          cargo test --all-features
          cargo test --no-default-features

      # Headless runner: start a session bus with an unlocked gnome-keyring Secret Service.
      # Compile first: keep the bus session short (a long build inside it once
      # left the second run without a Secret Service reply).
      - name: Rust tests (unit, IPC, live Secret Service)
        if: runner.os == 'Linux'
        run: |
          cargo test --all-features --no-run
          cargo test --no-default-features --no-run
          dbus-run-session -- bash -ec '
            echo -n ci-password | gnome-keyring-daemon --unlock --components=secrets
            cargo test --all-features
            cargo test --no-default-features
          '

      # pnpm version comes from package.json `packageManager`.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Build guest-js and check dist (publint, attw, smoke)
        run: pnpm build
      - name: guest-js tests
        run: pnpm test

      - uses: nttld/setup-ndk@v1
        if: runner.os == 'Linux'
        id: ndk
        with:
          ndk-version: r27c
      - name: Build for Android (Keystore backend)
        if: runner.os == 'Linux'
        shell: bash
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          tb="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          triple="${{ matrix.mobile }}"
          up=$(echo "$triple" | tr 'a-z-' 'A-Z_')
          export CC_${triple//-/_}="$tb/${triple}24-clang"
          export AR_${triple//-/_}="$tb/llvm-ar"
          export CARGO_TARGET_${up}_LINKER="$tb/${triple}24-clang"
          cargo build --target "$triple"

      - name: Build for iOS (data-protection keychain backend)
        if: runner.os == 'macOS'
        run: cargo build --target ${{ matrix.mobile }}
